services:
  postgres:
    image: postgres:16
    container_name: tbd-postgres
    environment:
      POSTGRES_DB: tbd_livros
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tbd-redis
    ports:
      - "6380:6379"

volumes:
  postgres_data:
